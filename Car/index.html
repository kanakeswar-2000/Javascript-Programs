<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./index.css"/>
    </head>
    <body>
        <div class="container">
            <div>
                <button class="engine-button" onClick="toggleStatus()" 
                        id="button" style="background-color: green;">Start</button>
                <p class="status">Status : <span id="status">Stopped </span></p>
                <button class="speed-btn" onclick="pressAccelerator()" id="accelerate">Accelerate</button>
                <button class="speed-btn" onclick="pressDecelerator()" id="decelerate">Decelerate</button>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
