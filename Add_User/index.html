<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="index.css"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="bg-container p-2">
        <h1 class="heading mb-3">Add User</h1>
        <form id="addUserForm">
            <div class="mb-3">
                <label>Name</label><br />
                <input type="text" class="form-control" id="name" />
                <p class="error-message" id="nameErrMsg"></p>
            </div>
            <div class="mb-3">
                <label>Email</label><br />
                <input type="text" class="form-control" id="email" />
                <p class="error-message" id="emailErrMsg"></p>
            </div>
            <div class="mb-3">
                <label>Working Status</label><br />
                <select class="form-control" id="status">
                    <option selected>Active</option>
                    <option>Inactive</option>
                </select>

            </div>
            <div class="mb-3">
                <label>Gender</label><br />
                <input type="radio" id="genderMale" value="Male" name="gender" checked />
                <label>Male</label>
                <input type="radio" id="genderFemale" value="Female" name="gender" />
                <label>Female</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>

        </form>
    </div>
    <script src="./index.js"></script>
</body>

</html>
